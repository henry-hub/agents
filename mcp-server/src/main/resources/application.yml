spring:
  application:
    name: ihub-mcp-server
  ai:
    mcp:
      server:
        name: IHub MCP Server
        version: 0.1.0
        type: SYNC

ihub:
  catalog:
    # 默认从 classpath 加载打包进 jar 的 catalog.json（开发/测试用）
    # 生产部署时可覆盖为文件系统路径，如：
    #   ihub.catalog.resource=file:/opt/ihub/libs/gradle/ihub-catalog/catalog.json
    resource: classpath:ihub-catalog/catalog.json
  modules:
    # 默认扫描 classpath 中 META-INF/ihub/module-descriptor.json（业务模块 JAR 携带）
    # 开发时可指向 modules 仓库的描述符，无需将业务模块 JAR 加入 classpath：
    #   ihub.modules.resource=file:///Users/henry/Documents/GitHub/modules/**/META-INF/ihub/module-descriptor.json
    resource: classpath*:META-INF/ihub/module-descriptor.json
